plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

// The Wear OS companion: a wrist remote for the phone app (live view, shutter, aim the gimbal). It never talks
// to the Osmo itself - everything goes through the phone over the Wearable Data Layer. The wire protocol and
// the display rules live in :wearprotocol, shared with the phone and unit-tested there.
// Same release signing as the phone app (local, gitignored keystore.properties): the phone and the watch app must
// be signed with the same key or the Wear OS Data Layer will not let them talk. Unsigned without it.
def keystorePropsFile = rootProject.file('keystore.properties')
def keystoreProps = new Properties()
if (keystorePropsFile.exists()) {
    keystorePropsFile.withInputStream { keystoreProps.load(it) }
}

android {
    namespace 'io.github.mugenoesis.sidereal.wear'
    compileSdk 36

    defaultConfig {
        // Same id as the phone app so the two are one product on Google Play; they are installed on different devices.
        applicationId "io.github.mugenoesis.sidereal"
        minSdk 25
        targetSdk 36
        versionCode 6
        versionName "0.3.0"
    }

    signingConfigs {
        release {
            if (keystorePropsFile.exists()) {
                storeFile rootProject.file(keystoreProps['storeFile'])
                storePassword keystoreProps['storePassword']
                keyAlias keystoreProps['keyAlias']
                keyPassword keystoreProps['keyPassword']
            }
        }
    }

    buildTypes {
        release {
            if (keystorePropsFile.exists()) {
                signingConfig signingConfigs.release
            }
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    kotlinOptions {
        jvmTarget = '1.8'
    }
}

dependencies {
    implementation project(':wearprotocol')
    implementation 'com.google.android.gms:play-services-wearable:19.0.0'
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.10.2'
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-play-services:1.10.2'
    implementation 'androidx.appcompat:appcompat:1.7.1'
    // Asks the phone to open its app (RemoteActivityHelper) when the watch hears nothing from it.
    implementation 'androidx.wear:wear-remote-interactions:1.1.0'
}
